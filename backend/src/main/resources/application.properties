server.servlet.context-path=/api

spring.application.name=phong-kham
spring.profiles.include=local

spring.datasource.url=jdbc:mysql://localhost:3306/phong_kham_nha_khoa?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jackson.time-zone=Asia/Ho_Chi_Minh

app.jwt.secret=${JWT_SECRET:}
app.jwt.access-minutes=30
app.jwt.refresh-days=7
app.jwt.cookie-secure=${JWT_COOKIE_SECURE:false}
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.cors.allowed-origins=http://localhost:5173

springdoc.swagger-ui.path=/swagger-ui.html

# BR-14: Chủ nhật 20:00 tự sao chép lịch tuần hiện tại sang tuần sau (cron 6 trường)
app.schedule.auto-copy.enabled=true
app.schedule.auto-copy.cron=0 0 20 * * SUN

# BR-12: khung khám và giờ nghỉ trưa chung của phòng khám
app.clinic.slot-minutes=30
app.clinic.lunch-start=11:30
app.clinic.lunch-end=13:30
app.clinic.max-booking-days=14
